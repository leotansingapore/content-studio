<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Studio — for advisors</title>
    <meta
      name="description"
      content="Turn your positioning into a week of posts. Plan a funnel-balanced calendar - Attraction, Building Trust, Conversion - then draft each post in 60 seconds."
    />
    <!-- preview fetchers not sent to api/page-og (vercel.json) still get the site card -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Content Studio" />
    <meta property="og:title" content="Content Studio" />
    <meta property="og:description" content="Turn your positioning into a week of posts. Plan a funnel-balanced calendar - Attraction, Building Trust, Conversion - then draft each post in 60 seconds." />
    <meta property="og:image" content="https://consultant-content-studio.vercel.app/og/site.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // The studio opens dark unless this device chose light (src/lib/theme.ts); public pages stay light. Before paint, so no flash.
      try {
        if (!/^\/(roadmap|auth|review|l|join|t)(\/|$)/.test(location.pathname) && localStorage.getItem("cs-theme") !== "light") {
          document.documentElement.classList.add("dark");
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#111214");
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Content Studio" />
    <link rel="preconnect" href="https://hgdbflprrficdoyxmdxe.supabase.co" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Serif:ital,opsz,wght@0,8..144,400;0,8..144,500;0,8..144,600;1,8..144,400&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Serif:ital,opsz,wght@0,8..144,400;0,8..144,500;0,8..144,600;1,8..144,400&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <script defer src="/_vercel/insights/script.js"></script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
