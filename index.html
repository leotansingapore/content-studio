<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- origin only on every request: an address with Telegram's login fields never rides along, even on a fetch the
         browser starts before the script below has run -->
    <meta name="referrer" content="strict-origin" />
    <script>
      // Telegram's login_url return (src/lib/telegramConnect.ts, takeTelegramLogin): its signed fields leave the address
      // before any other script, style, font or analytics runs, and wait in this tab for the Telegram card.
      (function () {
        try {
          var q = new URLSearchParams(location.search);
          if (!q.has("telegram")) return;
          var fields = ["telegram","id","first_name","last_name","username","photo_url","auth_date","hash"];
          var login = {};
          var keep = new URLSearchParams();
          q.forEach(function (v, k) {
            if (fields.indexOf(k) >= 0) login[k] = v;
            else keep.append(k, v);
          });
          var rest = keep.toString();
          history.replaceState(history.state, "", location.pathname + (rest ? "?" + rest : "") + location.hash);
          try {
            sessionStorage.setItem("cs-telegram-login", JSON.stringify(login));
          } catch (e) {
            window.__csTelegramLogin = login;
          }
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Postmosis</title>
    <meta
      name="description"
      content="Plan, write, design, edit and schedule your week's posts in one place."
    />
    <!-- preview fetchers not sent to api/page-og (vercel.json) still get the site card -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Postmosis" />
    <meta property="og:title" content="Postmosis" />
    <meta property="og:description" content="Plan, write, design, edit and schedule your week's posts in one place." />
    <meta property="og:image" content="https://app.postmosis.com/og/site.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // The studio opens dark unless this device chose light (src/lib/theme.ts); public pages stay light. Before paint, so no flash.
      try {
        if (!/^\/(roadmap|auth|review|l|join|t)(\/|$)/.test(location.pathname) && localStorage.getItem("cs-theme") !== "light") {
          document.documentElement.classList.add("dark");
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#111214");
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Postmosis" />
    <link rel="preconnect" href="https://hgdbflprrficdoyxmdxe.supabase.co" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Serif:ital,opsz,wght@0,8..144,400;0,8..144,500;0,8..144,600;1,8..144,400&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Serif:ital,opsz,wght@0,8..144,400;0,8..144,500;0,8..144,600;1,8..144,400&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <script defer src="/_vercel/insights/script.js"></script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
