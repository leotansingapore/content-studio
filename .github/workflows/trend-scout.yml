name: Trend scout

# Every morning: finds finance videos doing well on TikTok and Instagram (via
# Apify), pulls their transcripts, has Claude turn the best into content for
# Singapore consultants, and commits the drop to main, which Vercel deploys.
# There is no approval step: a run that can't produce enough valid trends
# writes nothing, so the last good drop stays up.
#
# Requires TWO repo secrets:
#   APIFY_TOKEN        - the scrape and transcripts (about US$1 a run)
#   ANTHROPIC_API_KEY  - writes the content kits
# Missing either one makes the job fail fast and write nothing.

on:
  schedule:
    # 01:50 UTC = 09:50 SGT. GitHub runs cron in UTC and can start late under
    # load. Deliberately after 01:30 UTC, so this drop replaces any news-based
    # drop another scheduled job commits earlier in the morning.
    - cron: "50 1 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "Number of trends to generate"
        required: false
        default: "12"
      dry_run:
        description: "Preview only: print the drop in the log without committing"
        type: boolean
        required: false
        default: false

# Never let two scouts run (and push) at once.
concurrency:
  group: trend-scout
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    # Apify runs (up to 12 min each) + one streamed Claude call.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Generate today's trend drop
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TREND_COUNT: ${{ github.event.inputs.count || '12' }}
          # A dry run writes the drop outside the repo, so nothing is committed.
          TREND_OUT: ${{ github.event.inputs.dry_run == 'true' && format('{0}/trends-preview.json', runner.temp) || '' }}
        run: node scripts/trend-scout.mjs

      - name: Commit if the drop changed
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if git diff --quiet -- src/data/trends.json; then
            echo "No change to trends.json — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Commit BEFORE pulling: git refuses to rebase over uncommitted changes.
          git add src/data/trends.json
          git commit -m "trends: viral drop for $(TZ=Asia/Singapore date +%Y-%m-%d)"
          # Other sessions push to main often. If one touched trends.json since
          # checkout, keep this run's fresh drop (-X theirs = the commit being
          # replayed during a rebase, i.e. ours).
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
