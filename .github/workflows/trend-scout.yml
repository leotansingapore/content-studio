name: Trend scout

# Scrapes the real viral TikTok/Instagram finance posts each morning (via
# Apify), ranks them by actual engagement, and rewrites the top ones into
# financial-advisor content for /trends. Commits the fresh drop to main, which
# (via Vercel's git integration) deploys the updated page.
#
# Requires TWO repo secrets:
#   APIFY_TOKEN        - scrapes the viral posts (the real source + metrics)
#   ANTHROPIC_API_KEY  - writes the advisor content kit for each post
# Missing either one makes the job fail fast and write nothing.

on:
  schedule:
    # 02:00 UTC = 10:00 Singapore time (SGT, UTC+8). GitHub runs cron in UTC and
    # timing is best-effort (can be delayed several minutes under load).
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "Number of trends to generate"
        required: false
        default: "24"

# Never let two scouts run (and push) at once.
concurrency:
  group: trend-scout
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    # Apify runs (up to 12 min each, in parallel) + one streamed Claude call.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Generate today's trend drop
        env:
          # APIFY_TOKEN scrapes the real viral TikTok/Instagram posts; without it
          # the job fails fast and writes nothing (no fabricated news sources).
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TREND_COUNT: ${{ github.event.inputs.count || '24' }}
        run: node scripts/trend-scout.mjs

      - name: Commit if the drop changed
        run: |
          if git diff --quiet -- src/data/trends.json; then
            echo "No change to trends.json — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Commit BEFORE pulling: git refuses to rebase over uncommitted
          # changes, which failed this step every time it was reached.
          git add src/data/trends.json
          git commit -m "trends: viral drop for $(TZ=Asia/Singapore date +%Y-%m-%d)"
          # Other sessions push to main often. If one touched trends.json since
          # checkout, keep this run's fresh drop (-X theirs = the commit being
          # replayed during a rebase, i.e. ours).
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
