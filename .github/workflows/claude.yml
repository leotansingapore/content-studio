name: Claude

# @claude in an issue, issue comment or PR review: Claude Code works the request on
# its own branch and replies in the thread with a link to open the pull request.
# Nothing lands on main until a person merges it.
# It runs on Leo's Max plan (CLAUDE_CODE_OAUTH_TOKEN, from `claude setup-token`), so only
# Leo's login can trigger it; add a login to the actor check to let someone else in.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      github.actor == 'leotansingapore' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on PRs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # CLAUDE.md says `npm run build` must pass before any push
          claude_args: |
            --allowedTools "Bash(npm ci),Bash(npm run build),Bash(npm test),Bash(npx vitest run:*)"
